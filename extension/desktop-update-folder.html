<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>はこホム拡張の更新先</title>
  <style>
    :root { color-scheme: light dark; font: 16px system-ui, sans-serif; }
    body { max-width: 42rem; margin: 3em auto; padding: 0 1em; line-height: 1.6; }
    button { font: inherit; margin: .25em .4em .25em 0; }
  </style>
  <script src="desktop-update-files.js" defer></script>
  <script src="desktop-update-folder.js" defer></script>
</head>
<body>
  <h1>はこホム拡張の更新先</h1>
  <p>Chromeに読み込んでいるはこホム拡張のフォルダーを選んでください。<code>manifest.json</code> が直接入っているフォルダーです。</p>
  <p>書き込みを許可すると、新版をこのフォルダーに適用します。ブラウザーから許可を求められたときは、次回も自動で適用したければ「毎回許可」に相当する項目を選んでください。</p>
  <button id="choose" type="button">更新先フォルダーを選ぶ</button>
  <button id="allow" type="button" hidden>書き込みを許可する</button>
  <button id="clear" type="button" hidden>登録を解除</button>
  <p id="status" role="status"></p>
</body>
</html>
